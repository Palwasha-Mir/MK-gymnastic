<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAKAV - Logo Preview</title>
    <!-- Google Font for Roman Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Exact Soft Light Beige Background (#F8F4F0) */
            background-color: #F8F4F0; 
            font-family: 'Cinzel', 'Times New Roman', serif;
        }

        .logo-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
        }

        svg {
            width: 100%;
            max-width: 380px;
            height: auto;
            display: block;
        }

        /* Roman Style Brand Typography 'M Λ K Λ V' */
        .brand-text {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 22px;
            font-size: 32px;
            /* Light Chocolate Brown (#5C3A21) */
            color: #5C3A21; 
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .brand-text span {
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="logo-wrapper">
        <!-- MAKAV Vector Logo SVG -->
        <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Color Gradient: Light Chocolate Brown -->
                <linearGradient id="chocColor" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#7B4E2E" />
                    <stop offset="100%" stop-color="#5C3A21" />
                </linearGradient>
            </defs>

            <!-- 1. Outer Semi-Circle Arc -->
            <path d="M 75,190 A 120,120 0 0,1 325,190" 
                  fill="none" 
                  stroke="url(#chocColor)" 
                  stroke-width="2.5" 
                  stroke-linecap="round"/>

            <!-- 2. Roman Serif 'M' -->
            <g stroke="url(#chocColor)" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M 80,250 L 80,140 L 125,218 L 170,140 L 170,250" stroke-width="5.5" />
                <path d="M 68,250 L 92,250 M 68,140 L 92,140 M 158,250 L 182,250" stroke-width="3.5" />
            </g>

            <!-- 3. Gymnast Silhouette Integrated with 'K' -->
            <g fill="url(#chocColor)">
                
                <!-- Straight Vertical Top Leg -->
                <path d="M 197,165 C 196,138 198,102 205,65 C 207,55 210,53 212,60 C 214,65 210,76 207,92 C 202,118 200,145 198,165 Z" />
                
                <!-- Straight Lower Leg -->
                <path d="M 195,190 C 195,212 197,240 196,268 C 196,275 193,278 191,273 C 188,263 190,232 191,212 C 192,201 194,193 195,190 Z" />

                <!-- Waist Back-Arch Flow -->
                <path d="M 195,185 C 184,163 173,132 187,105 C 189,101 191,103 190,107 C 179,130 187,158 196,177 Z" />

                <!-- Head with Bun & Bending Back Torso -->
                <circle cx="221" cy="188" r="6.5" />
                <path d="M 197,166 C 203,161 214,164 221,175 C 223,180 225,186 222,192 C 217,186 209,181 197,183 Z" />

                <!-- Upper Diagonal 'K' Arm/Hand (with finger details) -->
                <path d="M 218,170 C 232,148 253,119 272,94 C 274,91 278,89 276,95 C 273,101 268,109 266,114 C 264,109 270,98 272,96 C 253,122 232,152 220,175 Z" />

                <!-- Lower Diagonal 'K' Arm/Hand (extended reaching pose) -->
                <path d="M 220,188 C 238,205 262,228 281,247 C 284,250 287,252 283,254 C 280,256 275,249 272,243 C 271,250 274,254 277,251 C 259,232 235,208 218,191 Z" />

            </g>
        </svg>

        <!-- Custom Spaced Text M Λ K Λ V -->
        <div class="brand-text">
            <span>M</span>
            <span>Λ</span>
            <span>K</span>
            <span>Λ</span>
            <span>V</span>
        </div>
    </div>

</body>
</html>
