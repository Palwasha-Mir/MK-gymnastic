<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAKAV - Perfected Logo</title>
    <!-- Premium Roman/Classic Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Exact Soft Light Beige Background */
            background-color: #F8F4F0; 
            font-family: 'Cinzel', 'Times New Roman', serif;
        }

        .logo-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
        }

        svg {
            width: 100%;
            max-width: 380px;
            height: auto;
            display: block;
        }

        /* Brand Text M Λ K Λ V */
        .brand-text {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 22px;
            font-size: 32px;
            /* Light Chocolate Brown Color */
            color: #5C3A21; 
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .brand-text span {
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="logo-wrapper">
        <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Light Chocolate Brown Solid/Gradient (#5C3A21) -->
                <linearGradient id="chocColor" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#7B4E2E" />
                    <stop offset="100%" stop-color="#5C3A21" />
                </linearGradient>
            </defs>

            <!-- 1. Elegant Semi-Circle Arc -->
            <path d="M 70,185 A 125,125 0 0,1 330,185" 
                  fill="none" 
                  stroke="url(#chocColor)" 
                  stroke-width="2.5" 
                  stroke-linecap="round"/>

            <!-- 2. Clean Capital 'M' with Classic Serif Edges -->
            <g stroke="url(#chocColor)" fill="none" stroke-linecap="square" stroke-linejoin="miter">
                <!-- Main Bold Lines for Capital M -->
                <path d="M 75,250 L 75,135 L 125,220 L 175,135 L 175,250" stroke-width="6" />
                <!-- Serif Top/Bottom Bases -->
                <path d="M 65,250 L 85,250 M 65,135 L 85,135 M 165,250 L 185,250 M 165,135 L 185,135" stroke-width="3" />
            </g>

            <!-- 3. REALISTIC ANATOMICAL GYMNAST WITH ENHANCED 'K' STROKES -->
            <g fill="url(#chocColor)">
                
                <!-- Head & Hair Bun (Natural Head Angle) -->
                <circle cx="223" cy="180" r="7.5" />
                <circle cx="228" cy="177" r="3.5" /> <!-- Hair Bun -->

                <!-- Torso, Bust & Flexible Spine (Human Silhouette Curve) -->
                <path d="M 196,165 C 202,152 214,156 222,168 C 228,177 227,188 220,195 C 210,188 202,180 196,165 Z" />

                <!-- Waist to Hips Integration -->
                <path d="M 193,165 C 182,145 175,122 188,102 C 190,99 192,101 191,104 C 181,122 187,148 195,172 Z" />

                <!-- Straight Extended Vertical Leg (Left side of 'K' posture) -->
                <path d="M 197,160 C 197,130 200,95 208,60 C 210,50 214,50 213,58 C 209,72 203,115 199,160 Z" />

                <!-- Lower Extended Leg & Pointed Foot (Lower Vertical 'K' alignment) -->
                <path d="M 194,188 C 194,212 196,242 195,272 C 195,280 191,281 190,274 C 188,262 190,228 191,208 Z" />

                <!-- ENHANCED UPPER ARM & HAND (Upper Diagonal of 'K') -->
                <!-- Detailed arm contour reaching gracefully upwards -->
                <path d="M 218,166 C 235,140 256,112 280,88 C 283,85 287,87 284,92 C 278,100 270,112 265,120 C 262,112 271,98 276,92 C 255,116 235,144 220,172 Z" />

                <!-- ENHANCED LOWER ARM & HAND (Lower Diagonal of 'K') -->
                <!-- Detailed reaching arm reaching downward with fingertips shape -->
                <path d="M 220,192 C 238,212 264,235 286,254 C 289,257 292,258 288,261 C 284,263 278,255 274,248 C 273,254 277,258 280,255 C 261,235 236,210 217,192 Z" />

            </g>
        </svg>

        <!-- Brand Typography -->
        <div class="brand-text">
            <span>M</span>
            <span>Λ</span>
            <span>K</span>
            <span>Λ</span>
            <span>V</span>
        </div>
    </div>

</body>
</html>
